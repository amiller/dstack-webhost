# tee-daemon: TEE app hosting platform
# Deploy to Phala dstack CVM:
#   phala deploy --cvm-name <name> -c docker-compose.yaml -e .env
#
# Local dev:
#   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up --build
#   (GIT_COMMIT is asserted non-empty by the Dockerfile; an unset value fails the
#   build rather than baking an image that cannot say what it is — issue #106)
services:
  tee-daemon:
    build:
      context: .
      args:
        - GIT_COMMIT=${GIT_COMMIT:-}
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      - daemon_data:/var/lib/tee-daemon
      # Per-project broker sockets live under here (one subdir per project, each
      # holding that project's dstack.sock + creds.sock). It MUST be a host bind
      # (not a named volume) so the daemon can bind a project's OWN subdir into
      # that project's container at /run/broker — an app must only ever see
      # its own broker dir (cross-app GetKey derivation, issue #7).
      # BROKER_HOST_PATH names the host side.
      - ${BROKER_HOST_PATH:-/var/run/tee-broker}:/var/run/broker
    environment:
      - TEE_DAEMON_TOKEN=${TEE_DAEMON_TOKEN}
      - DAEMON_VOLUME_NAME=${DAEMON_VOLUME_NAME:-}
      - DAEMON_VOLUME_MOUNT=${DAEMON_VOLUME_MOUNT:-/var/lib/tee-daemon}
      # Host path backing the daemon's BROKER_SOCKET_DIR, so per-project subdirs
      # can be bind-mounted into each app's container. Must match the host side
      # of the /var/run/broker bind above.
      - BROKER_HOST_PATH=${BROKER_HOST_PATH:-/var/run/tee-broker}
      - BROKER_SOCKET_DIR=${BROKER_SOCKET_DIR:-/var/run/broker}

# Durability (RFC-0017): daemon_data holds ALL private state — project metadata,
# code, and the per-project dataDir volumes (e.g. an app's sealed cookie vault).
# On a Phala dstack CVM these named volumes live on the LUKS2-encrypted persistent
# disk, so they SURVIVE a same-CVM redeploy/restart. They do NOT survive being moved
# to a fresh/replacement CVM (new disk) — that requires the RFC-0017 export/import +
# pinned restore (GET /_api/export → POST /_api/import), not a volume flag.
# To pin private state to an operator-managed external volume (so it outlives this
# compose project), pre-create it and set DAEMON_VOLUME_NAME to its resolved name.
volumes:
  daemon_data:
    # external: true   # uncomment + pre-create for operator-managed durability
